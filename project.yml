name: 'Nullmark'
options:
  bundleIdPrefix: 'dev.openbunny.nullmark'
  deploymentTarget:
    macOS: '27.0'
  createIntermediateGroups: true
configs:
  Debug: 'debug'
  Release: 'release'
configFiles:
  Debug: 'Signing.xcconfig'
  Release: 'Signing.xcconfig'
packages:
  OpenBunnyTheme:
    url: 'https://github.com/openbunny/theme'
    version: '0.2.0'
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    SWIFT_VERSION: '6'
    SWIFT_STRICT_CONCURRENCY: 'complete'
    OTHER_SWIFT_FLAGS: '-strict-memory-safety'
    SWIFT_TREAT_WARNINGS_AS_ERRORS: 'YES'
    GCC_TREAT_WARNINGS_AS_ERRORS: 'YES'
    GCC_C_LANGUAGE_STANDARD: 'c11'
    WARNING_CFLAGS:
      - '-Wall'
      - '-Wextra'
      - '-Wpedantic'
    ENABLE_HARDENED_RUNTIME: 'YES'
    HEADER_SEARCH_PATHS:
      - '$(PROJECT_DIR)/CTask4PDF/include'
      - '$(PROJECT_DIR)/build/dev/mupdf/include'
    LIBRARY_SEARCH_PATHS:
      - '$(PROJECT_DIR)/build/dev/mupdf/lib'
    OTHER_LDFLAGS:
      - '-lmupdf'
      - '-lmupdf-third'
targets:
  Nullmark:
    type: 'application'
    platform: 'macOS'
    sources:
      - path: 'App/Sources'
      - path: 'CTask4PDF/task4pdf.c'
      - path: 'App/Assets.xcassets'
      - path: 'App/Assets/AppIcon.icon'
      - path: 'build/dev/mupdf/licenses'
        type: 'folder'
        buildPhase: 'resources'
    dependencies:
      - package: 'OpenBunnyTheme'
        product: 'OpenBunnyTheme'
      - package: 'OpenBunnyTheme'
        product: 'OpenBunnyUI'
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: 'AppIcon'
        PRODUCT_NAME: 'Nullmark'
        PRODUCT_BUNDLE_IDENTIFIER: 'dev.openbunny.nullmark'
        INFOPLIST_FILE: 'App/Info.plist'
        CODE_SIGN_ENTITLEMENTS: 'App/App.entitlements'
        SWIFT_OBJC_BRIDGING_HEADER: 'App/Nullmark-Bridging-Header.h'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: 'NO'
    scheme:
      testTargets:
        - 'NullmarkTests'
  NullmarkTests:
    type: 'bundle.unit-test'
    platform: 'macOS'
    sources:
      - path: 'AppTests'
      - path: 'App/Sources/EditorModel.swift'
      - path: 'App/Sources/FileMetadata.swift'
      - path: 'App/Sources/PDFEngine.swift'
      - path: 'App/Sources/PDFMetadata.swift'
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: 'App/Nullmark-Bridging-Header.h'
        OTHER_LDFLAGS: []
