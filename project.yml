name: Nullmark
options:
  bundleIdPrefix: dev.openbunny.nullmark
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  OpenBunnyTheme:
    url: https://github.com/openbunny/theme
    version: 0.1.1
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: -strict-memory-safety
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # MuPDF is a Homebrew-provided dylib (/opt/homebrew/lib), neither
    # Apple-signed nor vendored into the bundle. ENABLE_HARDENED_RUNTIME: NO
    # because hardened runtime's library validation refuses to load a dylib
    # not signed with the app's own Team ID. App.entitlements carries no
    # com.apple.security.app-sandbox for the same root cause: App Sandbox's
    # default file-read scope does not cover /opt/homebrew, so a sandboxed
    # process cannot open libmupdf.dylib to link it at launch. See README.md.
    ENABLE_HARDENED_RUNTIME: NO
    HEADER_SEARCH_PATHS:
      - $(PROJECT_DIR)/CTask4PDF/include
      - /opt/homebrew/include
    LIBRARY_SEARCH_PATHS:
      - /opt/homebrew/lib
    OTHER_LDFLAGS:
      - -lmupdf
targets:
  Nullmark:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: CTask4PDF/task4pdf.c
      - path: App/Assets.xcassets
    dependencies:
      - package: OpenBunnyTheme
        product: OpenBunnyTheme
      - package: OpenBunnyTheme
        product: OpenBunnyUI
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Nullmark
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbunny.nullmark
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Nullmark-Bridging-Header.h
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    scheme:
      testTargets:
        - NullmarkTests
  NullmarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
      - path: App/Sources/EditorModel.swift
      - path: App/Sources/FileMetadata.swift
      - path: App/Sources/PDFEngine.swift
      - path: App/Sources/PDFMetadata.swift
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: App/Nullmark-Bridging-Header.h
        OTHER_LDFLAGS: []
