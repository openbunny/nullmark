[project]
name = "nullmark-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fonttools==4.65.0",
  "hypothesis==6.168.4",
  "mypy==2.4.0",
  "pikepdf==10.16.0",
  "pytest==9.1.1",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # ruff format owns trailing commas; ruff's documentation lists COM812 as conflicting with it.
  "COM812",
  # REUSE.toml assigns copyright and licence to every path.
  "CPY001",
  # languages/python.md forbids docstrings.
  "D",
  # languages/python.md permits assert in a pytest body and in a helper invariant.
  "S101",
  # Every subprocess runs mutool, cc or a CLI this suite builds, with arguments the suite generates.
  "S603",
  # mutool and cc resolve from PATH, as they do in the justfile.
  "S607",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = [ "." ]

[[tool.mypy.overrides]]
# fontTools ships no type stubs.
module = [ "fontTools.*" ]
ignore_missing_imports = true
