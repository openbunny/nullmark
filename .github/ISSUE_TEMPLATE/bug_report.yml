name: Bug report
description: The app or the C core behaves differently from what it documents
title: "[bug]: "
labels: ["type/bug", "status/needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: The part of nullmark the bug is in.
      options:
        - SwiftUI app (App/Sources)
        - Redaction core (CTask4PDF)
        - Export and filesystem metadata
        - Build, toolchain, or install
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What happened, including any error text and any residual-text report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps run and the input document described. Do not attach the document or a screenshot of it; describe the text and layout that trigger the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nullmark version
      description: The release tag or commit the report applies to.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: The macOS version and architecture the report applies to.
      placeholder: "macOS 26.0 arm64"
    validations:
      required: true
  - type: input
    id: mupdf
    attributes:
      label: MuPDF version
      description: The output of `brew list --versions mupdf`.
    validations:
      required: false
