name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0
    with:
      runner: xcode-27
      xcode: "27.0"
      recipe: ci-check
      timeout-minutes: 45
