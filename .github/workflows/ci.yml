name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27]
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_27.0.app"
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
      - name: install Homebrew tools
        run: brew bundle
      - name: expose LLVM tools
        run: echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
      - name: just ci-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just ci-check
